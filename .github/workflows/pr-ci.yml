name: Backend CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.22'
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Build source distribution and wheel
        run: uv build
      - name: Ruff lint (advisory)
        id: ruff
        continue-on-error: true
        run: uv run --locked ruff check --output-format github
      - name: Type checking (advisory)
        id: ty
        continue-on-error: true
        run: uv run --locked ty check --output-format github
      - name: Summarize advisory checks
        if: steps.ruff.outcome == 'failure' || steps.ty.outcome == 'failure'
        run: |
          echo '::warning::Ruff or ty reported diagnostics. Review the advisory steps before merging.'
          echo 'Ruff or ty reported diagnostics. Review the advisory steps before merging.' >> "$GITHUB_STEP_SUMMARY"
