name: Backend PR CI

on:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.22'
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Build source distribution and wheel
        run: uv build
      - name: Check wheel deployment without a source checkout
        run: |
          deployment=$(mktemp -d)
          cd "$deployment"
          uv init --bare --python 3.13
          uv add "$GITHUB_WORKSPACE"/dist/*.whl
          uv run --locked bioflow-ai --help
          uv run --locked python "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
      - name: Ruff lint (advisory)
        id: ruff
        continue-on-error: true
        run: uv run --locked ruff check --output-format github
      - name: Type checking (advisory)
        id: ty
        continue-on-error: true
        run: uv run --locked ty check --output-format github
      - name: Summarize advisory checks
        if: steps.ruff.outcome == 'failure' || steps.ty.outcome == 'failure'
        run: |
          echo '::warning::Ruff or ty reported diagnostics. Review the advisory steps before merging.'
          echo 'Ruff or ty reported diagnostics. Review the advisory steps before merging.' >> "$GITHUB_STEP_SUMMARY"
