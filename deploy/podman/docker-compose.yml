x-milvus-image: &milvus-image docker.io/milvusdb/milvus:v3.0.2
x-rustfs-image: &rustfs-image docker.io/rustfs/rustfs:1.0.1
x-webui-image: &webui-image ghcr.io/qibebt-scc/bioflow-ai-web:1.0.0-beta

services:
  # Remove the matching owner marker after restoring files owned by a different user.
  milvus-volume-init:
    profiles: [volume-init]
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

  rustfs-volume-init:
    profiles: [volume-init]
    image: *rustfs-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        uid="$$(id -u rustfs)"
        gid="$$(id -g rustfs)"
        marker="/data/.rustfs-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /data for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /data
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rustfs:/data

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  rustfs:
    container_name: milvus-rustfs
    image: *rustfs-image
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    ports:
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rustfs:/data
    command: >
      --address :9000
      --console-enable
      /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  standalone:
    container_name: milvus-standalone
    image: *milvus-image
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      rustfs:
        condition: service_started
    networks:
      - milvus-net

  # 数据库服务
  rabbitmq-db:
    container_name: bioflow-ai-rabbitmq
    image: docker.io/library/rabbitmq:4.1.0-rc.1-management
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: bioflow_ai
      RABBITMQ_DEFAULT_PASS: 123456
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 31622400000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rabbitmq/data:/var/lib/rabbitmq:rw
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rabbitmq/log:/var/log/rabbitmq:rw
    networks:
      - rabbitmq-net
    restart: always

  redis-db:
    container_name: bioflow-ai-redis
    image: docker.io/library/redis:8.0-rc1-bookworm
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis/data:/data:rw
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis/logs:/logs:rw
    networks:
      - redis-net
    restart: always

  postgres-db:
    container_name: bioflow-ai-postgres
    image: docker.io/library/postgres:18.0-alpine
    shm_size: 2gb
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: bioflow_ai
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: bioflow_ai
    ports:
      - "5432:5432"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/18/docker:rw
      - ./presets/sql:/docker-entrypoint-initdb.d
    networks:
      - postgres-net
    restart: unless-stopped

  web-ui:
    container_name: bioflow-ai-web
    image: *webui-image
    environment:
      BACKEND_API_URL: http://host.docker.internal:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - web-ui-net
    restart: unless-stopped

networks:
  milvus-net:
    name: milvus
  rabbitmq-net:
    name: rabbitmq
  redis-net:
    name: redis
  postgres-net:
    name: postgres
  web-ui-net:
    name: web-ui
