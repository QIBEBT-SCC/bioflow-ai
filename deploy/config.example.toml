[security]
secret_key = "Replace this key; it encrypts stored application secrets"
session_idle_timeout_hours = 24
session_absolute_timeout_days = 7
login_max_failures = 10
login_failure_window_minutes = 15
user_cache_ttl_seconds = 300
cookie_secure = false # Local HTTP only; production HTTPS must use true.
cookie_samesite = "lax"

[logger]
level = "INFO"
fastapi_level = "INFO"
boto3_level = "INFO"
celery_level = "INFO"
error_level = "ERROR"
log_retention = "1 week"
log_rotation = "10 MB"

[network]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:3000"]
proxy_type = "http"
proxy_host = "localhost"
proxy_port = 7890
use_proxy = false

[persistent.database]
db_url = "postgresql+psycopg://bioflow_ai:123456@127.0.0.1:5432/bioflow_ai"

[persistent.cache]
llm_cache = "redis://localhost:6379/0"
monitor_cache = "redis://localhost:6379/2"
api_cache = "redis://localhost:6379/2"
catalog_generation_key_prefix = "bioflow:catalog-generation"
catalog_generation_lock_timeout_seconds = 900
catalog_generation_lock_renew_interval_seconds = 300
catalog_generation_search_epoch_ttl_seconds = 86400

[persistent.storage]
storage_path = "./storage"
bio_db_path = "./storage/bio_dbs"
genome_path = "./storage/genome"
test_data_path = "./testdata"

[persistent.storage.s3]
endpoint = "http://localhost:9000"
region = "us-east-1"
bucket = "bioflow-ai"
access_key = "minioadmin"
secret_key = "minioadmin"
use_ssl = true
presign_expire = 3600

[persistent.resource]
max_thread = 16
max_mem = "64G"

[docker]
container = "docker"
username = ""
password = ""
enable_gpu = false
gpu_devices = "all"  # "all" 表示所有GPU，或指定设备如 "0,1" 或 "0"

[code]
# Official PyPI: https://pypi.org/simple
# Tsinghua TUNA: https://pypi.tuna.tsinghua.edu.cn/simple
python_index_url = "https://pypi.org/simple"
# Official CRAN: https://cloud.r-project.org
# Tsinghua TUNA: https://mirrors.tuna.tsinghua.edu.cn/CRAN
cran_repository = "https://cloud.r-project.org"

[code_agent]
# Build environment/codex-acp/Dockerfile as this tag, or replace with the
# immutable digest published by your deployment pipeline.
image = "bioflow-ai/codex-acp:1.10.0-bioflow.2"
# Persistent Codex home shared by the API and agent worker. Never point this at
# a host user's ~/.codex; auth.json in this directory is the only durable state.
auth_path = "./storage/codex-auth"
# Configure sandbox, web search and command networking in Settings > Coding Agent.
login_ttl_seconds = 600
login_timeout_seconds = 600
session_ttl_seconds = 1800
event_ttl_seconds = 1800
heartbeat_seconds = 10
turn_timeout_seconds = 900
startup_timeout_seconds = 60
max_sessions_per_user = 2
max_sessions_system = 8
cpu_limit = 1.0
memory_limit = "1g"
pid_limit = 256

[celery]
broker = "amqp://bioflow_ai:123456@localhost:5672//"
backend = "redis://localhost:6379/1"

[workflow]
# Maximum active child runs per ForEach node. Applied by the workflow dispatcher.
max_parallel_items = 4

[knowledge_base]
milvus_url = "http://localhost:19530"
embedding_model = "Qwen/Qwen3-Embedding-4B"
base_url = "https://api.siliconflow.cn/v1/"
api_key = ""
timeout = 60

[pdf_parser]
engine = "open_mineru"
batch_size = 5

[pdf_parser.mineru]
api_url = "https://api.mineru.app"
api_key = ""
timeout = 600

[pdf_parser.open_mineru]
api_url = "http://localhost:8000"
timeout = 600

[develop]
checkpoint_url = "redis://localhost:6379/0"
