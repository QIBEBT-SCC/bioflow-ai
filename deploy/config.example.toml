[security]
secret_key = "Replace this key; it encrypts stored application secrets"
session_idle_timeout_hours = 24
session_absolute_timeout_days = 7
login_max_failures = 10
login_failure_window_minutes = 15
user_cache_ttl_seconds = 300
cookie_secure = false # Local HTTP only; production HTTPS must use true.
cookie_samesite = "lax"

[logger]
level = "INFO"
fastapi_level = "INFO"
boto3_level = "INFO"
celery_level = "INFO"
error_level = "ERROR"
log_retention = "1 week"
log_rotation = "10 MB"

[network]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:3000"]
proxy_type = "http"
proxy_host = "localhost"
proxy_port = 7890
use_proxy = false

[persistent.database]
db_url = "postgresql+psycopg://bioflow_ai:123456@127.0.0.1:5432/bioflow_ai"
checkpoint_url = "postgresql://bioflow_ai:123456@127.0.0.1:5432/langchain"

[persistent.cache]
monitor_cache = "redis://localhost:6379/2"
api_cache = "redis://localhost:6379/2"
catalog_generation_key_prefix = "bioflow:catalog-generation"
catalog_generation_lock_timeout_seconds = 900
catalog_generation_lock_renew_interval_seconds = 300

[persistent.storage]
storage_path = "./storage"
bio_db_path = "./storage/bio_dbs"
genome_path = "./storage/genome"
test_data_path = "./testdata"

[persistent.storage.s3]
endpoint = "http://localhost:9000"
region = "us-east-1"
bucket = "bioflow-ai"
access_key = "minioadmin"
secret_key = "minioadmin"
use_ssl = true
presign_expire = 3600

[docker]
container = "docker"
username = ""
password = ""
enable_gpu = false
gpu_devices = "all"  # "all" 表示所有GPU，或指定设备如 "0,1" 或 "0"

[code]
# Official PyPI: https://pypi.org/simple
# Tsinghua TUNA: https://pypi.tuna.tsinghua.edu.cn/simple
python_index_url = "https://pypi.org/simple"
# Official CRAN: https://cloud.r-project.org
# Tsinghua TUNA: https://mirrors.tuna.tsinghua.edu.cn/CRAN
cran_repository = "https://cloud.r-project.org"

[code_editing]
# Temporary native coding conversations; each message occupies the agent queue for one turn.
session_ttl_seconds = 1800
turn_timeout_seconds = 900
worker_stale_seconds = 60

[celery]
broker = "amqp://bioflow_ai:123456@localhost:5672//"
backend = "redis://localhost:6379/1"
execution_concurrency = 4
agent_concurrency = 4
# Seconds without a worker heartbeat before a running agent run is marked failed (minimum 60).
agent_heartbeat_timeout = 180

[workflow]
# Maximum active child runs per ForEach node. Applied by the workflow dispatcher in the API process.
max_parallel_items = 4
# Seconds without a worker heartbeat before a running node is marked failed (minimum 90).
heartbeat_timeout = 300

[agent_command]
# Timeout limits (seconds) for agent container run_command tools.
min_timeout = 10
inspection_default_timeout = 30
inspection_max_timeout = 300
coding_default_timeout = 45
coding_max_timeout = 600
trial_default_timeout = 60
trial_max_timeout = 1800

[knowledge_base]
milvus_url = "http://localhost:19530"
embedding_model = "Qwen/Qwen3-Embedding-4B"
base_url = "https://api.siliconflow.cn/v1/"
api_key = ""
timeout = 60

[pdf_parser]
engine = "local"
batch_size = 5
similarity_threshold = 0.5

[pdf_parser.mineru]
api_url = "https://api.mineru.app"
api_key = ""
timeout = 600

[pdf_parser.open_mineru]
api_url = "http://localhost:8000"
timeout = 600

