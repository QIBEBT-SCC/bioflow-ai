[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "celery[librabbitmq,redis]>=5.5.0",
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "langchain>=0.3.21",
    "langgraph>=0.2.73",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy-utils>=0.41.2",
    "sqlmodel>=0.0.24",
    "tomli-w>=1.2.0",
    "tqdm>=4.67.1",
    "uuid7>=0.1.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true
