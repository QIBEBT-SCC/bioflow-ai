[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "aiosqlite>=0.21.0",
    "bcrypt==4.3.0",
    "boto3>=1.42.18",
    "bs4>=0.0.2",
    "celery[librabbitmq,redis]>=5.6.0",
    "crawl4ai>=0.8.0",
    "ddgs>=9.5.2",
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-google-genai>=4.0.0",
    "langchain-milvus>=0.3.0",
    "langchain-model-profiles>=0.0.5",
    "langchain-openai>=1.1.10",
    "langchain-qwen3>=0.1.2",
    "langchain-redis>=0.2.5",
    "langgraph>=1.0.4",
    "langgraph-checkpoint-redis>=0.3.1",
    "loguru>=0.7.3",
    "markdown>=3.10.2",
    "nanoid>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "polars>=1.33.1",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.20",
    "rustworkx>=0.16.0",
    "sqlmodel>=0.0.27",
    "tomli-w>=1.2.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
podman = [
    "podman>=5.6.0",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "ARG002",
    "ARG004",
    "C90", # McCabe complexity
    "COM812", # Messes with the formatter
    "CPY", # No copyright
    "FIX002", # Line contains TODO
    "PERF203", # Rarely useful
    "PLR09", # Too many something (arg, statements, etc)
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link in TODO
    "Q000", # Using single quote
    "D100", # Public module doc
    "D101", # Missing docstring for public class
    "D107",
    "D417", # For Langchain runtime
    "E501", # Long line in docstring
    "PGH003",
    "UP045",
    # TODO rules
    "ANN401", # No Any types
    "BLE", # Blind exceptions
    "ERA", # No commented-out code
]
unfixable = [
    "B028", # People should intentionally tune the stacklevel
]

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-builtins.ignorelist = ["id", "input", "type"]
flake8-type-checking.runtime-evaluated-base-classes = ["pydantic.BaseModel", "langchain_core.load.serializable.Serializable", "langchain_core.runnables.base.RunnableSerializable", "langchain_core.language_models.base.BaseLanguageModel", "langchain_core.outputs.generation.Generation", "langchain_core.tools.base.BaseTool", ]
pep8-naming.classmethod-decorators = ["classmethod", "langchain_core.utils.pydantic.pre_init", "pydantic.field_validator", "pydantic.v1.root_validator", ]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"script/**.py" = ["T201"]
"test/**.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[dependency-groups]
dev = [
    "arize-phoenix-otel>=0.13.1",
    "boto3-stubs>=1.42.19",
    "celery-types>=0.23.0",
    "duckdb>=1.4.4",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "matplotlib>=3.10.8",
    "openinference-instrumentation-langchain>=0.1.53",
    "opentelemetry-sdk>=1.38.0",
    "pyppeteer>=0.0.25",
    "rich>=14.0.0",
    "seaborn>=0.13.2",
]
