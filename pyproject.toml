[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "aiosqlite>=0.21.0",
    "celery[librabbitmq,redis]>=5.5.2",
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "langchain>=0.3.21",
    "langchain-google-genai>=2.1.5",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=0.3.18",
    "langchain-postgres>=0.0.15",
    "langchain-qwen3>=0.1.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.21",
    "langgraph-checkpoint-sqlite>=2.0.10",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.2.5,<0.4",
    "podman>=5.6.0",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "pyppeteer>=2.0.0",
    "python-multipart>=0.0.20",
    "rustworkx>=0.16.0",
    "sqlalchemy-utils>=0.41.2",
    "sqlmodel>=0.0.24",
    "tomli-w>=1.2.0",
    "tqdm>=4.67.1",
    "uuid7>=0.1.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "rich>=14.0.0",
]
