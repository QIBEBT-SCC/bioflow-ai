[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "bcrypt>=5.0.0",
    "boto3>=1.40.0",
    "bs4>=0.0.2",
    "celery[librabbitmq,redis]>=5.6.0",
    "click>=8.1.0",
    "crawl4ai>=0.8.0",
    "ddgs>=9.10.0",
    "docker>=7.1.0",
    "fastapi>=0.130.0",
    "httpx[socks]>=0.28.1",
    "huggingface-hub>=1.4.0",
    "jinja2>=3.1.6",
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.3.0",
    "langchain-google-genai>=4.0.0",
    "langchain-milvus>=0.3.0",
    "langchain-model-profiles>=0.0.5",
    "langchain-openai>=1.1.10",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "loguru>=0.7.3",
    "markdown>=3.10.2",
    "nanoid>=2.0.0",
    "palitra>=0.1.0",
    "polars>=1.39.0",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.20",
    "rich>=14.2.0",
    "rustworkx>=0.16.0",
    "sqlmodel>=0.0.30",
    "tomli-w>=1.2.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
bioflow-ai = "script.cli:cli"

[project.optional-dependencies]
podman = [
    "podman>=5.6.0",
]
local-model = [
    "langchain-qwen3>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app", "llm", "script"]

[tool.uv]
package = true
override-dependencies = [
    "hf-xet>=1.4.0", # 解除 langchain-redis 的限制
]

[tool.uv.sources]
langchain-milvus = { git = "https://github.com/langchain-ai/langchain-milvus", subdirectory = "libs/milvus", rev = "refs/pull/124/head" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "ARG002",
    "ARG004",
    "C90",
    "COM812",
    "CPY",
    "FIX002",
    "PERF203",
    "PLR09",
    "TD002",
    "TD003",
    "Q000",
    "D100",
    "D101",
    "D107",
    "D417",
    "E501",
    "PGH003",
    "UP040",
    "UP045",
    "ANN401",
    "BLE",
    "ERA",
    "PLC0415",
]
unfixable = [
    "B028",
]

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-builtins.ignorelist = ["id", "input", "type"]
flake8-quotes.inline-quotes = "single"
flake8-type-checking.runtime-evaluated-base-classes = ["pydantic.BaseModel", "langchain_core.load.serializable.Serializable", "langchain_core.runnables.base.RunnableSerializable", "langchain_core.language_models.base.BaseLanguageModel", "langchain_core.outputs.generation.Generation", "langchain_core.tools.base.BaseTool", ]
pep8-naming.classmethod-decorators = ["classmethod", "langchain_core.utils.pydantic.pre_init", "pydantic.field_validator", "pydantic.v1.root_validator", ]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"script/**.py" = ["T201"]
"test/**.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[dependency-groups]
dev = [
    "arize-phoenix-otel>=0.15.0",
    "boto3-stubs>=1.42.19",
    "celery-types>=0.23.0",
    "connectorx>=0.4.5",
    "duckdb>=1.5.0",
    "matplotlib>=3.10.8",
    "openinference-instrumentation-langchain>=0.1.53",
    "seaborn>=0.13.2",
]
