[project]
name = "smart-school"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8",
    "langgraph>=0.2.73",
    "loguru>=0.7.3",
    "pydantic-settings>=2.8.1",
    "toil>=8.0.0",
    "tomli-w>=1.2.0",
]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 100

[tool.ruff.format]
# 使用单引号
quote-style = "single"
# 启用docstring代码片段格式化
docstring-code-format = true
skip-magic-trailing-comma = true
