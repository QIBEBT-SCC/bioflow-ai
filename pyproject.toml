[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "aiofiles>=24.1.0",
    "anyio>=4.11.0",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "boto3>=1.40.0",
    "bs4>=0.0.2",
    "celery[librabbitmq,redis]>=5.6.0",
    "click>=8.0.0",
    "crawl4ai>=0.8.0",
    "cryptography>=46.0.3",
    "ddgs>=9.10.0",
    "docker>=7.1.0",
    "fastapi>=0.130.0",
    "httpx[socks]>=0.28.1",
    "huggingface-hub>=1.4.0",
    "jinja2>=3.1.6",
    "langchain>=1.3.0",
    "langchain-anthropic>=1.4.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.3.0",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.0.0",
    "langchain-model-profiles>=0.0.5",
    "langchain-openai>=1.2.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "loguru>=0.7.3",
    "nanoid>=2.0.0",
    "orjson>=3.11.4",
    "polars>=1.39.0",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pymilvus>=3.0.0",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "tomli-w>=1.2.0",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "uuid7>=0.1.0",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
    "sqlalchemy>=2.0.44",
    "pybigwig>=0.3.24,<0.4",
    "hictkpy[numpy]>=1.4,<2",
]

[project.scripts]
bioflow-ai = "bioflow_ai.cli.main:cli"

[project.optional-dependencies]
podman = [
    "podman>=5.6.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.uv]
package = true
override-dependencies = [
    "hf-xet>=1.5.1", # 解除 langchain-redis 的限制, 同时满足 huggingface-hub 1.22+ 的 API 要求
]

[tool.uv.build-backend]
source-include = [
    "presets/**",
    "deploy/**",
    "uv.lock",
    ".python-version",
    ".gitignore",
]
# Keep generated data and local deployment helpers out of distributions.
source-exclude = ["/presets/*.parquet", "/presets/build/**", "/src/bioflow_ai/cli/maintenance/**"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN401",
    "ARG002",
    "ARG004",
    "ASYNC109",
    "BLE",
    "C90",
    "COM812",
    "CPY",
    "D100",
    "D101",
    "D104",
    "D107",
    "D417",
    "E501",
    "ERA",
    "FIX002",
    "PERF203",
    "PGH003",
    "PLC0415",
    "PLR09",
    "Q000",
    "S603",
    "TD002",
    "TD003",
    "UP040",
    "UP045",
]
unfixable = [
    "B028",
]

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-builtins.ignorelist = ["id", "input", "type"]
flake8-quotes.inline-quotes = "single"
flake8-type-checking.runtime-evaluated-base-classes = ["pydantic.BaseModel", "langchain_core.load.serializable.Serializable", "langchain_core.runnables.base.RunnableSerializable", "langchain_core.language_models.base.BaseLanguageModel", "langchain_core.outputs.generation.Generation", "langchain_core.tools.base.BaseTool", ]
pep8-naming.classmethod-decorators = ["classmethod", "langchain_core.utils.pydantic.pre_init", "pydantic.field_validator", "pydantic.v1.root_validator", ]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"src/bioflow_ai/cli/**.py" = ["T201"]
"test/**.py" = ["T201"]
"tests/**.py" = ["D100", "D101", "D102", "D103", "D104", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[tool.pyrefly]
project-includes = ["src/bioflow_ai/"]


[tool.pyrefly.errors]
bad-override = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated temporary external services"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.42.19",
    "celery-types>=0.23.0",
    "connectorx>=0.4.5",
    "duckdb>=1.5.0",
    "matplotlib>=3.10.8",
    "pyrefly>=1.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.0",
    "seaborn>=0.13.2",
    "types-docker>=7.1.0",
    "types-markdown>=3.10.2",
    "types-nanoid>=2.0.0",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12",
    "types-tqdm>=4.67.3",
]
