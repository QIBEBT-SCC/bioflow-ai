[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "aiosqlite>=0.21.0",
    "bcrypt==4.3.0",
    "bs4>=0.0.2",
    "celery[librabbitmq,redis]>=5.5.2",
    "crawl4ai>=0.7.6",
    "ddgs>=9.5.2",
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "httpx[socks]>=0.28.1",
    "langchain>=1.0.4",
    "langchain-community>=0.4.0",
    "langchain-google-genai>=3.0.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-milvus>=0.2.2",
    "langchain-model-profiles>=0.0.5",
    "langchain-openai>=1.0.1",
    "langchain-postgres>=0.0.15",
    "langchain-qwen3>=0.1.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres==3.0.0",
    "langgraph-checkpoint-sqlite==3.0.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "podman>=5.6.0",
    "polars>=1.33.1",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "rustworkx>=0.16.0",
    "sqlmodel>=0.0.27",
    "tomli-w>=1.2.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "llm*"]

[tool.uv]
package = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "C90", # McCabe complexity
    "COM812", # Messes with the formatter
    "FIX002", # Line contains TODO
    "PERF203", # Rarely useful
    "PLR09", # Too many something (arg, statements, etc)
    "RUF012", # Doesn't play well with Pydantic
    "TC001", # Doesn't play well with Pydantic
    "TC002", # Doesn't play well with Pydantic
    "TC003", # Doesn't play well with Pydantic
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link in TODO
    "RUF002", # Em-dash in docstring

    # TODO rules
    "ANN401", # No type Any
    "D100", # pydocstyle: missing docstring in public module
    "PLC0415", # pylint: import-outside-top-level
    "TRY301", # tryceratops: raise-within-try
]
unfixable = [
    "B028", # People should intentionally tune the stacklevel
    "PLW1510", # People should intentionally set the check argument
]

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-type-checking.runtime-evaluated-base-classes = ["pydantic.BaseModel", "langchain_core.load.serializable.Serializable", "langchain_core.runnables.base.RunnableSerializable"]
pep8-naming.classmethod-decorators = ["classmethod", "langchain_core.utils.pre_init", "pydantic.field_validator", "pydantic.v1.root_validator", ]
pyupgrade.keep-runtime-typing = true

[dependency-groups]
dev = [
    "arize-phoenix-otel>=0.13.1",
    "celery-types>=0.23.0",
    "openinference-instrumentation-langchain>=0.1.53",
    "pyppeteer>=0.0.25",
    "rich>=14.0.0",
]
