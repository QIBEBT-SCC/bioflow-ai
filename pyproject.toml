[project]
name = "smart-school"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "langgraph>=0.2.73",
    "loguru>=0.7.3",
    "prefect>=3.2.12",
    "pydantic-settings>=2.8.1",
    "tomli-w>=1.2.0",
]

[tool.prefect]
logging.level = "DEBUG"
client.api.url = "http://0.0.0.0:4200/api"
server.api.host = "0.0.0.0"
server.api.port = 4200

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 100

[tool.ruff.format]
# 使用单引号
quote-style = "single"
# 启用docstring代码片段格式化
docstring-code-format = true
skip-magic-trailing-comma = true
