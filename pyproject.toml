[project]
name = "bioflow-ai"
version = "0.1.0"
description = "A Graph-based Intelligent BioAnalysis Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "aiosqlite>=0.21.0",
    "bs4>=0.0.2",
    "celery[librabbitmq,redis]>=5.5.2",
    "crawl4ai==0.7.4",
    "ddgs>=9.5.2",
    "docker>=7.1.0",
    "fastapi>=0.115.8",
    "langchain==1.0.2",
    "langchain-community>=0.4.0",
    "langchain-google-genai>=2.1.5",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai==1.0.1",
    "langchain-postgres>=0.0.15",
    "langchain-qwen3>=0.1.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres==3.0.0",
    "langgraph-checkpoint-sqlite==3.0.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.2.5,<0.4",
    "podman>=5.6.0",
    "polars>=1.33.1",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "pyppeteer>=0.0.25",
    "python-multipart>=0.0.20",
    "rich>=14.0.0",
    "rustworkx>=0.16.0",
    "seaborn>=0.13.2",
    "sqlalchemy-utils>=0.41.2",
    "sqlmodel>=0.0.27",
    "tomli-w>=1.2.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.34.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "arize-phoenix-otel>=0.13.1",
    "celery-types>=0.23.0",
    "openinference-instrumentation-langchain>=0.1.53",
    "rich>=14.0.0",
]
