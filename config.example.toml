[security]
algorithm = "HS256"
access_token_expire_minutes = 1440

[logger]
level = "INFO"
fastapi_level = "INFO"
celery_level = "INFO"
error_level = "ERROR"
log_retention = "1 week"
log_rotation = "10 MB"

[network]
host = "0.0.0.0"
port = 8000
proxy_type = "http"
proxy_host = "localhost"
proxy_port = 7890
use_proxy = false

[persistent]
db_url = "postgresql://bioflow_ai:123456@127.0.0.1:5432/bioflow_ai"
storage_path = "./storage"

[celery]
broker = "amqp://bioflow_ai:123456@localhost:5672//"
backend = "redis://localhost:6379/0"
