[security]
algorithm = "HS256"
secret_key = "Your key"
access_token_expire_minutes = 1440

[logger]
level = "INFO"
fastapi_level = "INFO"
celery_level = "INFO"
error_level = "ERROR"
log_retention = "1 week"
log_rotation = "10 MB"

[network]
host = "0.0.0.0"
port = 8000
proxy_type = "http"
proxy_host = "localhost"
proxy_port = 7890
use_proxy = false

[persistent]
db_url = "postgresql://bioflow_ai:123456@127.0.0.1:5432/bioflow_ai"
llm_cache = "redis://localhost:6379/0"
monitor_cache = "redis://localhost:6379/2"
api_cache = "redis://localhost:6379/2"
storage_path = "./storage"
genome_path = "./storage/genome"
test_data_path = "./testdata"
max_thread = 8
max_mem = "4G"

[persistent.api_storage]
upload_dir = "./storage/uploads"
max_image_size = 10485760
max_document_size = 52428800
allowed_image_types = ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/bmp", "image/webp", "image/tiff"]
allowed_document_types = ["application/pdf", "text/plain", "text/markdown"]

[docker]
container = "docker"
username = ""
password = ""

[celery]
broker = "amqp://bioflow_ai:123456@localhost:5672//"
backend = "redis://localhost:6379/1"

[knowledge_base]
milvus_url = "http://localhost:19530"
embedding_model = "Qwen/Qwen3-Embedding-4B"
use_modelscope = false
embedding_device = "cuda:0"

[pdf_parser]
engine = "open_mineru"

[pdf_parser.mineru]
api_url = "https://api.mineru.app"
api_key = ""
timeout = 600

[pdf_parser.open_mineru]
api_url = "http://localhost:8000"
timeout = 600