version: '3.5'

services:
  # Milvus 相关服务
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  minio:
    container_name: milvus-minio
    image: docker.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  standalone:
    container_name: milvus-standalone
    image: docker.io/milvusdb/milvus:v2.6.4-gpu
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ "gpu" ]
              device_ids: [ "0" ]
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - milvus-net

  # 数据库服务
  rabbitmq-db:
    image: rabbitmq:4.1.0-rc.1-management
    ports:
      - "5672:5672"   # AMQP 协议端口
      - "15672:15672" # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: bioflow_ai
      RABBITMQ_DEFAULT_PASS: 123456
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 31622400000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rabbitmq/data:/var/lib/rabbitmq:rw
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rabbitmq/log:/var/log/rabbitmq:rw
    networks:
      - rabbitmq-net
    restart: always

  redis-db:
    image: redis:8.0-rc1-bookworm
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis/data:/data:rw
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis/logs:/logs:rw
    networks:
      - redis-net
    restart: always

  postgres-db:
    image: docker.io/library/postgres:18.0-alpine
    shm_size: 2gb
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: bioflow_ai
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: bioflow_ai
    ports:
      - "5432:5432"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/18/docker:rw
      - ./presets/sql:/docker-entrypoint-initdb.d
    networks:
      - postgres-net
    restart: unless-stopped

networks:
  milvus-net:
    name: milvus
  rabbitmq-net:
    name: rabbitmq
  redis-net:
    name: redis
  postgres-net:
    name: postgres
