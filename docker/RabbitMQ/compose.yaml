services:
  rabbitmq:
    image: rabbitmq:4.1.0-rc.1-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitserver
    ports:
      - "5672:5672"   # AMQP 协议端口
      - "15672:15672" # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: single_cell
      RABBITMQ_DEFAULT_PASS: single_cell
    volumes:
      - ./data:/var/lib/rabbitmq
      - ./log:/var/log/rabbitmq